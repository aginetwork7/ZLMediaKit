service:
  flush: 5
  log_level: info

pipeline:
  inputs:
    - name: cpu
      tag: host.cpu
      interval_sec: ${METRICS_INTERVAL_SEC}
    - name: node_exporter_metrics
      metrics: meminfo
      tag: host.meminfo
      scrape_interval: ${METRICS_INTERVAL_SEC}
      processors:
        metrics:
          - name: metrics_selector
            metric_name: /^node_memory_(MemTotal|MemAvailable|MemFree)_bytes$/
            action: include
          - name: labels
            upsert: media_server_id ${MEDIA_SERVER_ID}
    - name: netif
      tag: host.netif
      interface: eth0
      interval_sec: ${METRICS_INTERVAL_SEC}
  filters:
    - name: lua
      match: host.netif.*
      script: /fluent-bit/etc/netif_rates.lua
      call: add_bps
    - name: modify
      match: host.*
      add: media_server_id ${MEDIA_SERVER_ID}
  outputs:
    - name: opentelemetry
      match: host.*
      host: ${MEDIA_CONTROL_HOST}
      port: ${MEDIA_CONTROL_PORT}
      # 当前 media-control 与本机同处（host.docker.internal），流量不出宿主机；若控制面部署在其它主机，需开启 tls。
      # Media-control currently runs on the same host, so traffic stays local; enable tls if it moves to another host.
      # tls: true
      metrics_uri: /agi7/api/media-control/hook/on_system_metrics
      logs_uri: /agi7/api/media-control/hook/on_system_metrics
      # media-control 以本节点的 ZLM API secret 认证上报；改用独立 token 需要 media-control 同步支持。
      # media-control authenticates reports with this node's ZLM API secret; a separate token needs media-control support.
      header: Authorization Bearer ${MEDIA_SERVER_SECRET}
