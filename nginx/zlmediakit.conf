# Replace media.agi7.ai and the certificate paths before enabling this site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.agi7.ai;

    ssl_certificate     /etc/letsencrypt/live/_star_agi7_ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/_star_agi7_ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
